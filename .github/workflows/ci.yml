# CI — runs on every PR and push to main.
#
# Security model (see DEPLOY.md "Pattern A"):
#   - This workflow uses `pull_request` (NOT `pull_request_target`), so
#     code from fork PRs is checked out but secrets are NOT exposed.
#   - GITHUB_TOKEN is scoped to read-only. PRs cannot escalate.
#   - No deployment step lives here. Deploys are in release.yml and fire
#     only on `v*` tag pushes. Limiting who can push those tags takes a
#     repo tag ruleset (a setting, see release.yml's header) — branch
#     protection on `main` does not cover tags.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # Runs the same hooks contributors run locally (.pre-commit-config.yaml):
  # hygiene checks, detect-secrets against .secrets.baseline, and ruff. The
  # local hook is opt-in and bypassable (`--no-verify`), so without this job
  # nothing actually enforced detect-secrets on what reaches `main`.
  pre-commit:
    name: Pre-commit hooks (incl. detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      # --locked: also fail fast here if uv.lock is stale vs pyproject.toml,
      # since the release image build (`uv sync --locked`) would refuse it.
      - run: uv sync --all-extras --dev --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Spans the full requires-python range (>=3.11). 3.14 matches the
        # Dockerfile's runtime base image — prod must not run a Python
        # version CI never exercises.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev
      - run: uv run pytest -v

  # MCP conformance — lints this server's MCP setup with mcpconform
  # (https://github.com/cejor6/mcpconform). Two surfaces:
  #   1. server.json (the registry manifest) — static, via the published Action.
  #   2. the live tool surface — via the MCP stdio handshake (`inspect`).
  # Both are secret-free and make no Kalshi API calls: `tools/list` is local
  # schema enumeration, so a throwaway RSA key + placeholder creds are enough to
  # boot the server. Safe under `pull_request` (no secrets exposed to forks).
  # Provider targeting lives in mcpconform.config.json; the live-surface gate uses
  # --min-tools 1 (fail if no tools register) and --min-severity warn (info is advisory).
  mcp-conform:
    name: MCP conformance (mcpconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 1) Static lint of the registry manifest via the published Action.
      - name: Lint server.json
        uses: cejor6/mcpconform@e9129fdfc3ec7006c75b8d0fbc9bad645d663888  # v0.2.0
        with:
          files: server.json
          targets: anthropic,openai

      # 2) Lint the live tool surface (language-agnostic) via the MCP handshake.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Generate throwaway signing key (never leaves the runner temp dir)
        run: openssl genrsa -out "${{ runner.temp }}/mcpconform-ci.pem" 2048
      - name: Lint live tools/list
        env:
          KALSHI_API_KEY_ID: ci-placeholder
          KALSHI_PRIVATE_KEY_PATH: ${{ runner.temp }}/mcpconform-ci.pem
          KALSHI_ENV: demo
        # --min-tools 1 fails the build if the server boots but registers no tools
        # (e.g. an import silently broke) instead of passing green having linted
        # nothing. --min-severity warn keeps the gate to actionable findings; info
        # is advisory (and framework noise is auto-collapsed by default anyway).
        # mcpconform also exits non-zero on any error-tier finding or a boot failure.
        run: npx -y mcpconform@0.2.0 inspect --min-tools 1 --min-severity warn -- uv run kalshi-mcp
